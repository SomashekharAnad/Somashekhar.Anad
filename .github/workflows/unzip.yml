name: Unzip portfolio
on:
  push:
    paths: ['*.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o *.zip -d tmp
          cp -r tmp/portfolio/. .
          rm -rf tmp *.zip
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Extract portfolio" || echo "Nothing to commit"
          git push
